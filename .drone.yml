kind: pipeline
type: kubernetes
name: default

clone:
  depth: 0

steps:
  - name: install
    image: node:22
    commands:
      - npm ci

  - name: verify
    image: node:22
    commands:
      - npm run check
      - npm test
      - npm run content:preflight

  - name: build
    image: node:22
    commands:
      - npm run build

  - name: deploy-pages
    image: node:22
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - 'npx wrangler pages deploy dist --project-name arkwebservices-com --branch=main'

trigger:
  branch:
    - main
  event:
    - push

---
kind: pipeline
type: kubernetes
name: weekly-content

clone:
  depth: 0

steps:
  - name: write-reviewed-drafts
    image: node:22
    environment:
      # These subscription/compute routes are the only allowed providers.
      # Do not add API providers or set LLM_ALLOW_PAID=1 in this pipeline.
      LLM_PROVIDER_ORDER: codex-cli
      LLM_PROVIDER_ORDER_LIGHT: codex-cli
      LLM_PROVIDER_ORDER_HEAVY: codex-cli
      LLM_ALLOW_PAID: "0"
      LLM_MAX_CALLS_PER_RUN: "10"
      CODEX_CLI_HOST:
        from_secret: AGENT_CLI_HOST
      AGENT_CLI_SSH_KEY:
        from_secret: AGENT_CLI_SSH_KEY
      AGENT_CLI_SSH_KEY_FILE: /tmp/agent-cli-key
      CODEX_CLI_BIN: codex.cmd
    commands:
      - npm ci
      - npm run content:preflight
      - 'printf "%s\n" "$AGENT_CLI_SSH_KEY" > "$AGENT_CLI_SSH_KEY_FILE" && chmod 600 "$AGENT_CLI_SSH_KEY_FILE"'
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - 'echo "192.168.1.241 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMdyaayirvJ1qJT01CBa3+J/kwSYjRV3DgEYUbTuvbYl" >> ~/.ssh/known_hosts'
      - npm run editorial:trend
      - npm run write:weekly
      - npm run lead:write
      - npm run content:preflight

  # Persist generated material as draft source on main. Draft article and lead
  # routes are excluded from the public site, feeds, and sitemaps until review.
  - name: persist-drafts
    image: node:22
    commands:
      - 'node --import tsx scripts/lib/repo-commit.ts --message "chore(content): add gated weekly draft [skip ci]" data/editorial/article-queue.json data/lead-pages/queue.json data/trends/ data/briefs/ data/runs/ data/engine-ledger.json src/content/posts/ src/content/lead-pages/'

trigger:
  event:
    - cron
  cron:
    - weekly-content
